[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aicp"
version = "0.1.0"
description = "Official Python SDK for NuRoute — provider-agnostic inference client"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["httpx>=0.27.0"]

[project.urls]
Homepage = "https://github.com/NuRoute-ai/sdk-python"
Repository = "https://github.com/NuRoute-ai/sdk-python"
Issues = "https://github.com/NuRoute-ai/sdk-python/issues"
Documentation = "https://nuroute.ai/docs"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.hatch.build.targets.wheel]
packages = ["aicp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
